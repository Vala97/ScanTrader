name: Update Pokémon catalog

on:
  schedule:
    # Daily, after Magic. A catalog that passes every check is uploaded.
    # No new sets is a success with no upload.
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Write the catalog locally and do not upload
        type: boolean
        default: true
      set_ids:
        description: Optional TCGdex set ids, comma-separated, for example sv10
        type: string
        default: ""
        required: false

permissions:
  contents: write

# Same group as Magic so the two jobs cannot upload stcat-index.json at once.
concurrency:
  group: stcat-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tools/update_pokemon_catalog/requirements.txt
            tools/publish_stcat/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/update_pokemon_catalog/requirements.txt
          pip install -r tools/publish_stcat/requirements.txt

      - name: Update catalog
        id: build
        env:
          # Schedule publishes. A manual run uploads only when dry_run is false (default true).
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          SET_IDS: ${{ github.event_name == 'workflow_dispatch' && inputs.set_ids || '' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pokemon-catalog"
          args=(
            --out "$RUNNER_TEMP/pokemon-catalog/pokemon-en.stcat"
            --cache "$HOME/.cache/scantrader/pokemon"
            --result "$RUNNER_TEMP/pokemon-catalog/update-result.json"
          )
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "${SET_IDS}" ]; then
            args+=(--sets "${SET_IDS}")
          fi
          python tools/update_pokemon_catalog/update_pokemon_catalog.py "${args[@]}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ["RUNNER_TEMP"], "pokemon-catalog", "update-result.json").read_text())
          sets = result.get("new_sets") or []
          sets_text = ",".join(str(item) for item in sets)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as handle:
              handle.write(f"added={int(result.get('added') or 0)}\n")
              handle.write(f"unchanged={str(bool(result.get('unchanged'))).lower()}\n")
              handle.write(f"validated={str(bool(result.get('validated'))).lower()}\n")
              handle.write(f"skipped={str(bool(result.get('skipped'))).lower()}\n")
              handle.write(f"new_sets={sets_text}\n")
          summary = [
              "### Pokémon catalog",
              f"- new sets: {sets_text or '(none)'}",
              f"- skipped: {str(bool(result.get('skipped'))).lower()}",
              f"- added: {int(result.get('added') or 0)}",
              f"- validated: {str(bool(result.get('validated'))).lower()}",
          ]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(summary) + "\n", encoding="utf-8")
          PY

      - name: Upload to the existing stcat release
        if: steps.build.outputs.validated == 'true' && steps.build.outputs.added != '0' && (github.event_name == 'schedule' || inputs.dry_run == false)
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          # Never `gh release create`: that replaces the asset list on an existing tag.
          # pokemon-en.stcat goes up first. The index is uploaded only after that file exists.
          # No other release, tag, or asset is touched.
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "tools/publish_stcat")
          from publish_stcat import release_upload_allowed
          result = json.loads(Path(os.environ["RUNNER_TEMP"], "pokemon-catalog", "update-result.json").read_text())
          dry = os.environ.get("DRY_RUN_INPUT", "false") == "true"
          if not release_upload_allowed(
              event=os.environ["GITHUB_EVENT_NAME"],
              dry_run=dry,
              validated=bool(result.get("validated")),
              added=int(result.get("added") or 0),
          ):
              raise SystemExit("refusing to upload")
          Path(os.environ["RUNNER_TEMP"], "pokemon-upload-args").write_text(
              result["stcat"] + "\n" + result["index"] + "\n",
              encoding="utf-8",
          )
          PY
          stcat="$(sed -n '1p' "$RUNNER_TEMP/pokemon-upload-args")"
          index="$(sed -n '2p' "$RUNNER_TEMP/pokemon-upload-args")"
          gh release upload stcat --repo Vala97/ScanTrader --clobber "$stcat"
          gh release upload stcat --repo Vala97/ScanTrader --clobber "$index"
          prerelease="$(gh release view stcat --repo Vala97/ScanTrader --json isPrerelease --jq .isPrerelease)"
          if [ "$prerelease" != "false" ]; then
            echo "stcat must stay a normal release, not a prerelease."
            exit 1
          fi
