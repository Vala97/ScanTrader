name: Update Magic catalog

on:
  schedule:
    # Daily. A catalog that passes every check is uploaded. No new sets is a success with no upload.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Write the catalog locally and do not upload
        type: boolean
        default: true
      set_code:
        description: Optional Scryfall set code, for example trk
        type: string
        default: ""
        required: false
      force:
        description: Rebuild and publish even when no released set changed
        type: boolean
        default: false

permissions:
  contents: write

# Shared with the Pokémon workflow so two uploads cannot rewrite stcat-index.json together.
concurrency:
  group: stcat-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/update_mtg_catalog/requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/scantrader/milo.onnx
          key: milo-onnx-bd13d8d60383c69da04dce261f32e93fdaeaa8fd618fbc991e7385f71b3d45df

      - name: Install
        run: pip install -r tools/update_mtg_catalog/requirements.txt

      - name: Build the catalog
        id: build
        env:
          # Schedule publishes. A manual run uploads only when dry_run is false (default true).
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          SET_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.set_code || '' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          args=(--out-dir "$RUNNER_TEMP/mtg-catalog" --cache "$HOME/.cache/scantrader")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$FORCE" = "true" ]; then
            args+=(--force)
          fi
          if [ -n "$SET_CODE" ]; then
            args+=(--set "$SET_CODE")
          fi
          python tools/update_mtg_catalog/update_mtg_catalog.py "${args[@]}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ["RUNNER_TEMP"], "mtg-catalog", "update-result.json").read_text())
          sets = result.get("new_sets") or []
          sets_text = ",".join(str(item) for item in sets)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as handle:
              handle.write(f"added={int(result.get('added') or 0)}\n")
              handle.write(f"unchanged={str(bool(result.get('unchanged'))).lower()}\n")
              handle.write(f"validated={str(bool(result.get('validated'))).lower()}\n")
              handle.write(f"skipped={str(bool(result.get('skipped'))).lower()}\n")
              handle.write(f"changed={str(bool(result.get('changed'))).lower()}\n")
              handle.write(f"force={str(bool(result.get('force'))).lower()}\n")
              handle.write(f"new_sets={sets_text}\n")
          summary = [
              "### Magic catalog",
              f"- new sets: {sets_text or '(none)'}",
              f"- skipped: {str(bool(result.get('skipped'))).lower()}",
              f"- added: {int(result.get('added') or 0)}",
              f"- validated: {str(bool(result.get('validated'))).lower()}",
          ]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(summary) + "\n", encoding="utf-8")
          PY

      - name: Upload to the existing stcat release
        if: steps.build.outputs.validated == 'true' && (steps.build.outputs.changed == 'true' || steps.build.outputs.force == 'true') && (github.event_name == 'schedule' || inputs.dry_run == false)
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          FORCE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          # Never `gh release create`: that replaces the asset list on an existing tag.
          # The new .npz goes up first. The index is uploaded only after that file exists.
          # Previous .npz names are left in place. No other release or tag is touched.
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "tools/publish_stcat")
          from publish_stcat import release_upload_allowed
          result = json.loads(Path(os.environ["RUNNER_TEMP"], "mtg-catalog", "update-result.json").read_text())
          event = os.environ["GITHUB_EVENT_NAME"]
          dry = os.environ.get("DRY_RUN_INPUT", "false") == "true"
          force = os.environ.get("FORCE_INPUT", "false") == "true"
          if not release_upload_allowed(
              event=event,
              dry_run=dry,
              validated=bool(result.get("validated")),
              added=int(result.get("added") or 0),
              force=force,
              changed=bool(result.get("changed")),
          ):
              raise SystemExit("refusing to upload")
          Path(os.environ["RUNNER_TEMP"], "mtg-upload-args").write_text(result["npz"] + "\n")
          PY
          npz="$(cat "$RUNNER_TEMP/mtg-upload-args")"
          index="$RUNNER_TEMP/mtg-catalog/stcat-index.json"
          gh release upload stcat --repo Vala97/ScanTrader --clobber "$npz"
          gh release upload stcat --repo Vala97/ScanTrader --clobber "$index"
          prerelease="$(gh release view stcat --repo Vala97/ScanTrader --json isPrerelease --jq .isPrerelease)"
          if [ "$prerelease" != "false" ]; then
            echo "stcat must stay a normal release, not a prerelease."
            exit 1
          fi
