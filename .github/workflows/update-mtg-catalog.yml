name: Update Magic catalog

on:
  schedule:
    # Weekly. Stays a dry run unless someone starts it by hand with dry_run false.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Write the catalog locally and do not upload
        type: boolean
        default: true
      set_code:
        description: Optional Scryfall set code, for example trk
        type: string
        default: ""
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/update_mtg_catalog/requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/scantrader/milo.onnx
          key: milo-onnx-bd13d8d60383c69da04dce261f32e93fdaeaa8fd618fbc991e7385f71b3d45df

      - name: Install
        run: pip install -r tools/update_mtg_catalog/requirements.txt

      - name: Build the catalog
        id: build
        env:
          DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
          SET_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.set_code || '' }}
        run: |
          set -euo pipefail
          args=(--out-dir "$RUNNER_TEMP/mtg-catalog" --cache "$HOME/.cache/scantrader")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "$SET_CODE" ]; then
            args+=(--set "$SET_CODE")
          fi
          python tools/update_mtg_catalog/update_mtg_catalog.py "${args[@]}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ["RUNNER_TEMP"], "mtg-catalog", "update-result.json").read_text())
          path = Path(os.environ["GITHUB_OUTPUT"])
          with path.open("a") as handle:
              handle.write(f"added={int(result.get('added') or 0)}\n")
              handle.write(f"unchanged={str(bool(result.get('unchanged'))).lower()}\n")
          PY

      - name: Upload to the existing stcat release
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false && steps.build.outputs.added != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
        run: |
          set -euo pipefail
          # Never `gh release create`: that replaces the asset list on an existing tag.
          # Upload only the new .npz name plus the index, so the previous .npz stays.
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ["RUNNER_TEMP"], "mtg-catalog", "update-result.json").read_text())
          Path(os.environ["RUNNER_TEMP"], "mtg-upload-args").write_text(result["npz"] + "\n")
          PY
          npz="$(cat "$RUNNER_TEMP/mtg-upload-args")"
          index="$RUNNER_TEMP/mtg-catalog/stcat-index.json"
          gh release upload stcat --repo Vala97/ScanTrader --clobber "$npz" "$index"
          prerelease="$(gh release view stcat --repo Vala97/ScanTrader --json isPrerelease --jq .isPrerelease)"
          if [ "$prerelease" != "false" ]; then
            echo "stcat must stay a normal release, not a prerelease."
            exit 1
          fi
