name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          KS: ${{ secrets.SCANTRADER_KEYSTORE_BASE64 }}
          PW: ${{ secrets.SCANTRADER_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.SCANTRADER_KEYSTORE_KEY_ALIAS }}
          KEYPW: ${{ secrets.SCANTRADER_KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ] && [ -n "$ALIAS" ] && [ -n "$KEYPW" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Signing secrets are incomplete. The release build will not run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Decode keystore
        env:
          SCANTRADER_KEYSTORE_BASE64: ${{ secrets.SCANTRADER_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$SCANTRADER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/scantrader.jks"
          test -s "$RUNNER_TEMP/scantrader.jks"

      - name: Assemble signed release
        env:
          SCANTRADER_KEYSTORE_FILE: ${{ runner.temp }}/scantrader.jks
          SCANTRADER_KEYSTORE_PASSWORD: ${{ secrets.SCANTRADER_KEYSTORE_PASSWORD }}
          SCANTRADER_KEYSTORE_KEY_ALIAS: ${{ secrets.SCANTRADER_KEYSTORE_KEY_ALIAS }}
          SCANTRADER_KEYSTORE_KEY_PASSWORD: ${{ secrets.SCANTRADER_KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain :app:assembleRelease --no-daemon --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Write app-update.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES="$(git tag -l --format='%(contents)' "$TAG" | sed '/^$/d' | head -n 20)"
          if [ -z "$NOTES" ]; then
            VERSION_NAME="$(sed -n 's/^VERSION_NAME=//p' app/version.properties | head -n 1)"
            NOTES="Versione ${VERSION_NAME}."
          fi
          python3 tools/publish_app_update/publish_app_update.py \
            app/build/outputs/apk/release/app-release.apk \
            --notes "$NOTES" \
            --out "$RUNNER_TEMP/app-update.json" \
            --asset-name ScanTrader.apk
          if ! gh release view app-update >/dev/null 2>&1; then
            gh release create app-update --prerelease \
              --title "Aggiornamenti ScanTrader" \
              --notes "Canale di aggiornamento in-app. Prerelease: il release dei cataloghi (stcat) resta l'ultimo non-prerelease."
          fi
          gh release edit app-update --prerelease
          gh release upload app-update --clobber \
            "$RUNNER_TEMP/ScanTrader.apk" \
            "$RUNNER_TEMP/app-update.json"
